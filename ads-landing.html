<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>جارٍ التحميل...</title>
<meta name="robots" content="noindex,nofollow">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700&display=swap" rel="stylesheet">
<style>
  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
  body{
    font-family:'Cairo',sans-serif;
    background:#0f0f1a;
    color:#e8eaf6;
    min-height:100vh;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    gap:24px;
    padding:20px;
  }

  .msg{
    text-align:center;
    color:#9fa3c4;
    font-size:0.9rem;
  }

  /* ═══ حاويات الإعلانات ═══ */

  /* كمبيوتر: 728×90 أعلى */
  .ad-wrap{
    display:flex;
    align-items:center;
    justify-content:center;
    overflow:hidden;
    width:100%;
  }

  /* native */
  #ad-native-landing{
    width:100%;
    max-width:700px;
  }

  /* rectangle 300×250 */
  #ad-rect-landing{
    display:flex;
    align-items:center;
    justify-content:center;
  }
</style>
</head>
<body>

<div class="msg">⏳ يرجى الانتظار...</div>

<!-- ══════════════════════════════════════════
     حاوية: 728×90 كمبيوتر / 320×50 هاتف
     (adsterra.js بيحدد الصح تلقائياً)
     ══════════════════════════════════════════ -->
<div class="ad-wrap" id="ad-top-landing"></div>

<!-- ══════════════════════════════════════════
     حاوية: Native Banner — كمبيوتر + هاتف
     ══════════════════════════════════════════ -->
<div id="ad-native-landing"></div>

<!-- ══════════════════════════════════════════
     حاوية: 300×250 — كمبيوتر + هاتف
     ══════════════════════════════════════════ -->
<div id="ad-rect-landing"></div>

<!-- ══════════════════════════════════════════
     حاوية: 468×60 — كمبيوتر فقط
     ══════════════════════════════════════════ -->
<div class="ad-wrap" id="ad-468-landing"></div>

<!-- تحميل إعلانات Adsterra -->
<script src="adsterra-landing.js"></script>

</body>
</html>
