<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>اتصل بنا | LinkFast</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
<style>
  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
  :root{--bg:#0f0f1a;--card:#1b1d30;--border:#2a2d46;--accent:#7b7ef8;--text:#e8eaf6;--muted:#9fa3c4;--success:#22c55e}
  body{font-family:'Cairo',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;display:flex;flex-direction:column}
  .site-header{position:sticky;top:0;z-index:800;background:rgba(15,15,26,0.95);backdrop-filter:blur(12px);border-bottom:1px solid var(--border);padding:0 24px;height:56px;display:flex;align-items:center;justify-content:space-between}
  .logo{font-size:1.1rem;font-weight:900;color:var(--accent);text-decoration:none}
  .header-links{display:flex;gap:16px}
  .header-links a{color:var(--muted);font-size:0.82rem;text-decoration:none;transition:color .2s}
  .header-links a:hover{color:var(--accent)}
  main{flex:1;padding:48px 16px}
  .container{max-width:680px;margin:0 auto}
  .card{background:var(--card);border:1px solid var(--border);border-radius:20px;padding:40px}
  h1{font-size:1.7rem;font-weight:900;margin-bottom:8px}
  .sub{color:var(--muted);font-size:0.9rem;margin-bottom:32px}
  .field{margin-bottom:18px}
  label{display:block;font-size:.85rem;font-weight:700;color:var(--muted);margin-bottom:8px}
  input,select,textarea{width:100%;background:var(--bg);border:1.5px solid var(--border);border-radius:12px;padding:12px 16px;font-size:.95rem;color:var(--text);font-family:'Cairo',sans-serif;outline:none;transition:border-color .2s}
  input:focus,select:focus,textarea:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(123,126,248,.15)}
  input::placeholder,textarea::placeholder{color:#5c6080}
  textarea{resize:vertical;min-height:120px}
  select option{background:var(--card)}
  .btn{width:100%;padding:14px;background:var(--accent);color:#fff;border:none;border-radius:12px;font-size:1rem;font-weight:700;font-family:'Cairo',sans-serif;cursor:pointer;transition:all .2s;margin-top:4px}
  .btn:hover{background:#5b5ef4;transform:translateY(-1px)}
  .divider{border:none;border-top:1px solid var(--border);margin:28px 0}
  .social-links{display:flex;flex-wrap:wrap;gap:12px}
  .social-link{display:flex;align-items:center;gap:8px;padding:10px 16px;border:1px solid var(--border);border-radius:10px;color:var(--muted);font-size:.85rem;text-decoration:none;transition:all .2s;flex:1;min-width:140px}
  .social-link:hover{border-color:var(--accent);color:var(--accent);background:rgba(123,126,248,.07)}
  .site-footer{border-top:1px solid var(--border);text-align:center;padding:20px;color:var(--muted);font-size:.8rem}
  .site-footer a{color:var(--muted);text-decoration:none;margin:0 8px}
  .site-footer a:hover{color:var(--accent)}
</style>
</head>
<body>
<header class="site-header">
  <a href="generator.html" class="logo">🔗 LinkFast</a>
  <nav class="header-links">
    <a href="about.html">من نحن</a>
    <a href="privacy.html">الخصوصية</a>
    <a href="contact.html">اتصل بنا</a>
  </nav>
</header>
<main>
  <div class="container">
    <div class="card">
      <h1>اتصل بنا</h1>
      <p class="sub">نرد عادةً في غضون 24 ساعة</p>

      <div class="field">
        <label>الاسم</label>
        <input type="text" id="c-name" placeholder="اسمك">
      </div>
      <div class="field">
        <label>البريد الإلكتروني</label>
        <input type="email" id="c-email" placeholder="email@example.com" dir="ltr">
      </div>
      <div class="field">
        <label>الموضوع</label>
        <select id="c-subject">
          <option value="">اختر الموضوع</option>
          <option>دعم فني</option>
          <option>استفسار عن الإعلانات</option>
          <option>تعاون</option>
          <option>أخرى</option>
        </select>
      </div>
      <div class="field">
        <label>الرسالة</label>
        <textarea id="c-msg" placeholder="اكتب رسالتك..."></textarea>
      </div>
      <button class="btn" onclick="sendMsg()">📨 إرسال</button>

      <hr class="divider">

      <p style="font-size:.85rem;color:var(--muted);margin-bottom:16px;font-weight:700">أو تواصل معنا عبر</p>
      <div class="social-links">
        <a href="https://www.youtube.com/playlist?list=PLRl_JqdizTBw" target="_blank" rel="noopener" class="social-link">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="#FF0000"><path d="M23.5 6.2a3 3 0 00-2.1-2.1C19.5 3.6 12 3.6 12 3.6s-7.5 0-9.4.5A3 3 0 00.5 6.2C0 8.1 0 12 0 12s0 3.9.5 5.8a3 3 0 002.1 2.1c1.9.5 9.4.5 9.4.5s7.5 0 9.4-.5a3 3 0 002.1-2.1C24 15.9 24 12 24 12s0-3.9-.5-5.8zM9.7 15.5V8.5l6.3 3.5-6.3 3.5z"/></svg>
          يوتيوب
        </a>
        <a href="https://t.me/yourchannel" target="_blank" rel="noopener" class="social-link">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="#2CA5E0"><path d="M12 0C5.37 0 0 5.37 0 12s5.37 12 12 12 12-5.37 12-12S18.63 0 12 0zm5.94 8.19l-2.02 9.5c-.15.66-.54.82-1.08.51l-3-2.21-1.45 1.39c-.16.16-.3.29-.6.29l.21-3.02 5.5-4.96c.24-.21-.05-.33-.37-.12L6.6 13.88 3.65 13c-.66-.21-.68-.66.14-.97l11.6-4.47c.55-.2 1.03.13.55.63z"/></svg>
          تيليجرام
        </a>
        <a href="https://facebook.com/yourpage" target="_blank" rel="noopener" class="social-link">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="#1877F2"><path d="M24 12.07C24 5.41 18.63 0 12 0S0 5.4 0 12.07C0 18.1 4.39 23.1 10.13 24v-8.44H7.08v-3.49h3.04V9.41c0-3.02 1.8-4.7 4.54-4.7 1.31 0 2.68.24 2.68.24v2.97h-1.5c-1.5 0-1.96.93-1.96 1.89v2.26h3.32l-.53 3.5h-2.8V24C19.62 23.1 24 18.1 24 12.07z"/></svg>
          فيسبوك
        </a>
      </div>
    </div>
  </div>
</main>
<footer class="site-footer">
  <p>
    <a href="privacy.html">سياسة الخصوصية</a>
    <a href="disclaimer.html">إخلاء المسؤولية</a>
    <a href="contact.html">اتصل بنا</a>
    <a href="about.html">من نحن</a>
  </p>
  <p style="margin-top:10px">© <span id="yr"></span> LinkFast</p>
</footer>
<script>
  document.getElementById('yr').textContent = new Date().getFullYear();
  function sendMsg() {
    const name = document.getElementById('c-name').value.trim();
    const email = document.getElementById('c-email').value.trim();
    const subject = document.getElementById('c-subject').value;
    const msg = document.getElementById('c-msg').value.trim();
    if (!name || !email || !msg) { alert('⚠️ ملء جميع الحقول مطلوب'); return; }
    const s = encodeURIComponent(`[LinkFast] ${subject || 'رسالة'} — ${name}`);
    const b = encodeURIComponent(`الاسم: ${name}\nالبريد: ${email}\n\n${msg}`);
    window.location.href = `mailto:contact@yoursite.com?subject=${s}&body=${b}`;
  }
</script>
</body>
</html>
