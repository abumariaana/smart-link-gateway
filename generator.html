<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>مولّد الروابط</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'Cairo', sans-serif;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
    background: #0f0f1a;
    color: #e8eaf6;
  }

  .card {
    background: #1b1d30;
    border: 1px solid #2a2d46;
    border-radius: 24px;
    padding: 40px;
    width: 100%;
    max-width: 560px;
    box-shadow: 0 20px 60px rgba(0,0,0,0.4);
  }

  .logo {
    text-align: center;
    margin-bottom: 32px;
  }

  .logo h1 {
    font-size: 1.6rem;
    font-weight: 900;
    color: #7b7ef8;
  }

  .logo p {
    color: #9fa3c4;
    font-size: 0.9rem;
    margin-top: 6px;
  }

  label {
    display: block;
    font-size: 0.85rem;
    font-weight: 700;
    color: #9fa3c4;
    margin-bottom: 8px;
  }

  .field {
    margin-bottom: 20px;
  }

  input[type="url"], input[type="number"] {
    width: 100%;
    background: #0f0f1a;
    border: 1.5px solid #2a2d46;
    border-radius: 12px;
    padding: 13px 16px;
    font-size: 0.95rem;
    color: #e8eaf6;
    font-family: 'Cairo', sans-serif;
    outline: none;
    direction: ltr;
    transition: border-color 0.2s;
  }

  input:focus {
    border-color: #7b7ef8;
    box-shadow: 0 0 0 3px rgba(123,126,248,0.15);
  }

  input::placeholder { color: #5c6080; }

  .btn {
    width: 100%;
    padding: 15px;
    background: #7b7ef8;
    color: #fff;
    border: none;
    border-radius: 12px;
    font-size: 1rem;
    font-weight: 700;
    font-family: 'Cairo', sans-serif;
    cursor: pointer;
    transition: all 0.2s;
    margin-top: 4px;
  }

  .btn:hover { background: #5b5ef4; transform: translateY(-1px); }
  .btn:active { transform: translateY(0); }

  .result {
    display: none;
    margin-top: 24px;
    background: #0f0f1a;
    border: 1.5px solid #7b7ef8;
    border-radius: 12px;
    padding: 16px 20px;
  }

  .result.show { display: block; }

  .result-label {
    font-size: 0.78rem;
    font-weight: 700;
    color: #7b7ef8;
    margin-bottom: 10px;
  }

  .result-url {
    font-size: 0.82rem;
    color: #e8eaf6;
    word-break: break-all;
    direction: ltr;
    line-height: 1.6;
    background: #1b1d30;
    padding: 10px 14px;
    border-radius: 8px;
    margin-bottom: 12px;
    font-family: monospace;
  }

  .copy-btn {
    width: 100%;
    padding: 10px;
    background: #7b7ef8;
    color: #fff;
    border: none;
    border-radius: 8px;
    font-size: 0.9rem;
    font-weight: 700;
    font-family: 'Cairo', sans-serif;
    cursor: pointer;
    transition: all 0.2s;
  }

  .copy-btn:hover { background: #5b5ef4; }
  .copy-btn.done { background: #22c55e; }

  .note {
    margin-top: 20px;
    padding: 14px 16px;
    background: rgba(123,126,248,0.08);
    border-radius: 10px;
    border-right: 3px solid #7b7ef8;
    font-size: 0.82rem;
    color: #9fa3c4;
    line-height: 1.7;
  }

  .divider {
    border: none;
    border-top: 1px solid #2a2d46;
    margin: 24px 0;
  }

  .seconds-row {
    display: flex;
    align-items: center;
    gap: 12px;
  }

  .seconds-row input {
    width: 100px;
    flex-shrink: 0;
  }

  .seconds-row span {
    color: #9fa3c4;
    font-size: 0.9rem;
  }
</style>
</head>
<body>

<div class="card">
  <div class="logo">
    <h1>🔗 مولّد الروابط</h1>
    <p>ادمج رابط إعلاناتك مع أي رابط تحميل</p>
  </div>

  <div class="field">
    <label>🌐 رابط صفحة الإعلانات</label>
    <input type="url" id="landingUrl" placeholder="https://yoursite.com/ads.html">
  </div>

  <div class="field">
    <label>📥 رابط الملف (ميديا فاير أو أي رابط)</label>
    <input type="url" id="fileUrl" placeholder="https://www.mediafire.com/file/xxx">
  </div>

  <div class="field">
    <label>⏱️ مدة العداد</label>
    <div class="seconds-row">
      <input type="number" id="seconds" value="15" min="5" max="60">
      <span>ثانية قبل ظهور زر التحميل</span>
    </div>
  </div>

  <button class="btn" onclick="generate()">⚡ ولّد الرابط</button>

  <div class="result" id="result">
    <div class="result-label">✅ الرابط جاهز — انسخه واختصره في Bitly أو أي موقع</div>
    <div class="result-url" id="resultUrl"></div>
    <button class="copy-btn" id="copyBtn" onclick="copyLink()">📋 نسخ الرابط</button>
  </div>

  <div class="note">
    💡 <strong>الخطوة التالية:</strong> انسخ الرابط واختصره في أي موقع مثل
    <strong>Bitly</strong> أو <strong>TinyURL</strong> — ثم ابعت الرابط المختصر لجمهورك
  </div>
</div>

<script>
  function generate() {
    const landing = document.getElementById('landingUrl').value.trim();
    const file    = document.getElementById('fileUrl').value.trim();
    const secs    = document.getElementById('seconds').value || 15;

    if (!landing || !file) {
      alert('⚠️ ضع الرابطين الاتنين');
      return;
    }

    // الرابط بيشيل كل البيانات جوه نفسه
    const base    = location.href.replace('generator.html', 'redirect.html');
    const link    = `${base}?landing=${encodeURIComponent(landing)}&file=${encodeURIComponent(file)}&secs=${secs}`;

    document.getElementById('resultUrl').textContent = link;
    document.getElementById('result').classList.add('show');
    document.getElementById('copyBtn').textContent = '📋 نسخ الرابط';
    document.getElementById('copyBtn').classList.remove('done');
  }

  function copyLink() {
    const url = document.getElementById('resultUrl').textContent;
    navigator.clipboard.writeText(url).then(() => {
      const btn = document.getElementById('copyBtn');
      btn.textContent = '✅ تم النسخ!';
      btn.classList.add('done');
    });
  }

  // Enter key
  document.addEventListener('keydown', e => { if (e.key === 'Enter') generate(); });
</script>
</body>
</html>
