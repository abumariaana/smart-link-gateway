<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>جاري التحويل...</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
      background-color: #f7f9fa;
      color: #333;
    }
    .loading-box {
      text-align: center;
      padding: 40px;
      background-color: black;
      color: white;
      border-radius: 15px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.3);
    }
    .spinner {
      border: 4px solid #333;
      border-top: 4px solid #3498db;
      border-radius: 50%;
      width: 40px;
      height: 40px;
      animation: spin 1s linear infinite;
      margin: 0 auto 15px;
    }
    #timer {
      font-size: 28px;
      font-weight: bold;
      color: #3498db;
      display: inline-block;
    }
    .btn {
      display: inline-block;
      margin-top: 25px;
      padding: 12px 25px;
      background-color: #3498db;
      color: white;
      text-decoration: none;
      border-radius: 8px;
      font-weight: bold;
    }
    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
  </style>
</head>
<body>

  <div class="loading-box">
    <div class="spinner"></div>
    <p>جاري تحويلك إلى الصفحة المطلوبة...</p>
    <span>سيتم التحويل بعد: <span id="timer">5</span> ثوانٍ</span>
    <br>
    <a id="redirect-btn" class="btn" href="#">اضغط هنا إذا لم يتم تحويلك</a>
  </div>

  <script>
    const urlParams = new URLSearchParams(window.location.search);
    const targetUrl = urlParams.get('url');
    const secondsParam = urlParams.get('time');
    let timeLeft = secondsParam ? parseInt(secondsParam) : 5; 

    if (targetUrl) {
      document.getElementById('redirect-btn').href = targetUrl;
      const timerElement = document.getElementById('timer');
      timerElement.textContent = timeLeft;

      const countdown = setInterval(() => {
        timeLeft--;
        timerElement.textContent = timeLeft;
        if (timeLeft <= 0) {
          clearInterval(countdown);
          window.location.replace(targetUrl);
        }
      }, 1000);
    } else {
      document.querySelector('.loading-box p').textContent = "لم يتم تحديد رابط وجهة صالح.";
      document.querySelector('.loading-box span').style.display = 'none';
      document.querySelector('.spinner').style.display = 'none';
      document.getElementById('redirect-btn').style.display = 'none';
    }
  </script>

</body>
</html>
