<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>جاري التحويل...</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      padding: 20px;
      box-sizing: border-box;
      background-color: #f7f9fa;
      color: #333;
    }
    #ad-container {
      width: 100%;
      max-width: 320px;
      min-height: 0;
      margin: 0 auto 16px;
    }
    .ad-card {
      display: flex;
      flex-direction: column;
      gap: 5px;
      width: 100%;
      min-height: 90px;
      padding: 14px 18px;
      box-sizing: border-box;
      border: 1px solid #cbd5e1;
      border-radius: 12px;
      background: linear-gradient(135deg, #ffffff, #e8f1ff);
      color: #172554;
      text-decoration: none;
      text-align: center;
      box-shadow: 0 3px 10px rgba(0,0,0,.12);
    }
    .ad-card:hover { background: #dbeafe; }
    .ad-label { font-size: 11px; color: #64748b; }
    .ad-action { font-size: 12px; color: #2563eb; }
    .loading-box {
      text-align: center;
      padding: 40px;
      background-color: black;
      color: white;
      border-radius: 15px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.3);
    }
    .spinner {
      border: 4px solid #333;
      border-top: 4px solid #3498db;
      border-radius: 50%;
      width: 40px;
      height: 40px;
      animation: spin 1s linear infinite;
      margin: 0 auto 15px;
    }
    #timer {
      font-size: 28px;
      font-weight: bold;
      color: #3498db;
      display: inline-block;
    }
    .btn {
      display: inline-block;
      margin-top: 25px;
      padding: 12px 25px;
      background-color: #3498db;
      color: white;
      text-decoration: none;
      border-radius: 8px;
      font-weight: bold;
    }
    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
  <!-- إعلان مرئي؛ النقر يفتح رابط الإعلان في تبويب مستقل -->
  <div id="ad-container" aria-label="إعلان">
    <a class="ad-card" href="https://hecticwelcomingassociation.com/a0h6a5p0w?key=3916093b4f41fc449057a56ca11ab876" target="_blank" rel="noopener noreferrer">
      <span class="ad-label">إعلان</span>
      <strong>اكتشف العرض الآن</strong>
      <span class="ad-action">اضغط لفتح الإعلان ←</span>
    </a>
  </div>
  <div class="loading-box">
    <div class="spinner"></div>
    <p>جاري تحويلك إلى الصفحة المطلوبة...</p>
    <span>سيتم التحويل بعد: <span id="timer">5</span> ثوانٍ</span>
    <br>
    <a id="redirect-btn" class="btn" href="#">اضغط هنا للانتقال للرابط</a>
  </div>
  <script>
    const urlParams = new URLSearchParams(window.location.search);
    const encodedUrl = urlParams.get('b64');
    const directUrl = urlParams.get('url');
    const buttonText = urlParams.get('text') || 'اضغط هنا للانتقال للرابط';
    const secondsParam = parseInt(urlParams.get('time'), 10);

    function decodeBase64Utf8(value) {
      try {
        const binary = atob(value.replace(/-/g, '+').replace(/_/g, '/'));
        const bytes = Uint8Array.from(binary, char => char.charCodeAt(0));
        return new TextDecoder('utf-8').decode(bytes);
      } catch (error) {
        return '';
      }
    }

    const targetUrl = encodedUrl ? decodeBase64Utf8(encodedUrl) : directUrl;
    const timerElement = document.getElementById('timer');
    const redirectButton = document.getElementById('redirect-btn');
    const messageElement = document.querySelector('.loading-box p');
    const countdownLabel = document.querySelector('.loading-box > span');
    let timeLeft = Number.isFinite(secondsParam) && secondsParam >= 0 ? secondsParam : 5;

    if (targetUrl && /^https?:\/\//i.test(targetUrl)) {
      redirectButton.href = targetUrl;
      redirectButton.textContent = buttonText;
      timerElement.textContent = timeLeft;

      const countdown = setInterval(() => {
        timeLeft -= 1;
        timerElement.textContent = Math.max(timeLeft, 0);
        if (timeLeft <= 0) {
          clearInterval(countdown);
          window.location.assign(targetUrl);
        }
      }, 1000);
    } else {
      messageElement.textContent = 'لم يتم تحديد رابط وجهة صالح.';
      countdownLabel.style.display = 'none';
      document.querySelector('.spinner').style.display = 'none';
      redirectButton.style.display = 'none';
    }
  </script>
</body>
</html>
