<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>جارٍ التحضير...</title>
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'Cairo', sans-serif;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 24px;
    background: #0f0f1a;
    color: #e8eaf6;
  }

  .card {
    background: #1b1d30;
    border: 1px solid #2a2d46;
    border-radius: 24px;
    padding: 40px 36px;
    width: 100%;
    max-width: 440px;
    text-align: center;
    box-shadow: 0 20px 60px rgba(0,0,0,0.4);
  }

  h2 {
    font-size: 1.25rem;
    font-weight: 700;
    margin-bottom: 8px;
    color: #e8eaf6;
  }

  .sub {
    color: #9fa3c4;
    font-size: 0.9rem;
    margin-bottom: 32px;
    line-height: 1.6;
  }

  /* ── دائرة العداد ── */
  .circle-wrap {
    position: relative;
    width: 140px;
    height: 140px;
    margin: 0 auto 32px;
  }

  svg.ring {
    transform: rotate(-90deg);
    width: 140px;
    height: 140px;
  }

  .track {
    fill: none;
    stroke: #2a2d46;
    stroke-width: 10;
  }

  .prog {
    fill: none;
    stroke: #7b7ef8;
    stroke-width: 10;
    stroke-linecap: round;
    stroke-dasharray: 377;
    stroke-dashoffset: 0;
    transition: stroke-dashoffset 1s linear, stroke 0.3s;
  }

  .num {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    font-size: 2.8rem;
    font-weight: 900;
    color: #7b7ef8;
    line-height: 1;
  }

  .num small {
    font-size: 0.7rem;
    color: #5c6080;
    font-weight: 500;
    margin-top: 4px;
  }

  /* ── إعلان ── */
  .ad-box {
    background: #0f0f1a;
    border: 2px dashed #2a2d46;
    border-radius: 12px;
    min-height: 90px;
    display: flex;
    align-items: center;
    justify-content: center;
    color: #5c6080;
    font-size: 0.8rem;
    margin-bottom: 28px;
    padding: 12px;
    line-height: 1.6;
  }

  /* ── زر التحميل ── */
  .dl-btn {
    display: none;
    width: 100%;
    padding: 16px;
    background: #22c55e;
    color: #fff;
    border: none;
    border-radius: 14px;
    font-size: 1.05rem;
    font-weight: 800;
    font-family: 'Cairo', sans-serif;
    cursor: pointer;
    text-decoration: none;
    transition: all 0.2s;
    box-shadow: 0 4px 20px rgba(34,197,94,0.3);
    animation: pulse 1s ease infinite;
  }

  .dl-btn.show {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
  }

  .dl-btn:hover {
    background: #16a34a;
    transform: translateY(-2px);
    box-shadow: 0 8px 28px rgba(34,197,94,0.4);
  }

  @keyframes pulse {
    0%, 100% { box-shadow: 0 4px 20px rgba(34,197,94,0.3); }
    50%       { box-shadow: 0 4px 32px rgba(34,197,94,0.6); }
  }

  .error {
    color: #ef4444;
    font-size: 0.95rem;
    padding: 20px;
  }
</style>
</head>
<body>

<div class="card" id="card">

  <!-- حالة الخطأ لو الرابط ناقص -->
  <div class="error" id="errMsg" style="display:none">
    ⚠️ رابط غير صالح — تأكد من الرابط
  </div>

  <!-- المحتوى الأساسي -->
  <div id="main" style="display:none">

    <h2 id="title">⏳ جارٍ تجهيز الملف...</h2>
    <p class="sub" id="subtitle">انتظر حتى ينتهي العداد ثم اضغط زر التحميل</p>

    <!-- دائرة العداد -->
    <div class="circle-wrap">
      <svg class="ring" viewBox="0 0 140 140">
        <circle class="track" cx="70" cy="70" r="60"/>
        <circle class="prog"  cx="70" cy="70" r="60" id="prog"/>
      </svg>
      <div class="num">
        <span id="numDisplay">15</span>
        <small>ثانية</small>
      </div>
    </div>

    <!-- مكان الإعلان -->
    <div class="ad-box" id="adBox">
      <!-- ══════════════════════════════════════
           ضع كود إعلانك هنا
           للموبايل: 320×100 أو 320×50
           للكمبيوتر: 728×90 أو 300×250
           ══════════════════════════════════════ -->
      📢 ضع كود إعلانك هنا
    </div>

    <!-- زر التحميل — مخفي حتى ينتهي العداد -->
    <a href="#" id="dlBtn" class="dl-btn" target="_blank" rel="noopener">
      ⬇️ تحميل الملف الآن
    </a>

  </div>
</div>

<script>
  const CIRC = 2 * Math.PI * 60; // 377

  const params   = new URLSearchParams(location.search);
  const landing  = params.get('landing');
  const file     = params.get('file');
  const secs     = parseInt(params.get('secs')) || 15;

  const errMsg   = document.getElementById('errMsg');
  const mainDiv  = document.getElementById('main');
  const prog     = document.getElementById('prog');
  const numEl    = document.getElementById('numDisplay');
  const titleEl  = document.getElementById('title');
  const subEl    = document.getElementById('subtitle');
  const dlBtn    = document.getElementById('dlBtn');

  // لو الرابط ناقص — اعرض خطأ
  if (!landing || !file) {
    errMsg.style.display = 'block';
  } else {
    mainDiv.style.display = 'block';

    // افتح صفحة الإعلانات في الخلفية (iframe مخفي)
    const fr = document.createElement('iframe');
    fr.src = landing;
    fr.style.cssText = 'position:fixed;width:1px;height:1px;opacity:0;pointer-events:none;border:none';
    document.body.appendChild(fr);

    // ابدأ العداد
    prog.style.strokeDasharray  = CIRC;
    prog.style.strokeDashoffset = 0;

    numEl.textContent = secs;
    let remaining = secs;

    const timer = setInterval(() => {
      remaining--;
      numEl.textContent = remaining;

      // تحديث الدائرة
      const offset = CIRC * (remaining / secs);
      prog.style.strokeDashoffset = CIRC - offset;

      // لون الدائرة يتغير مع اقتراب النهاية
      if (remaining <= 3) prog.style.stroke = '#22c55e';

      if (remaining <= 0) {
        clearInterval(timer);
        // أظهر زر التحميل
        dlBtn.href = file;
        dlBtn.classList.add('show');
        titleEl.textContent = '✅ جاهز للتحميل!';
        subEl.style.display = 'none';
        // اخفي العداد
        document.querySelector('.circle-wrap').style.display = 'none';
      }
    }, 1000);
  }
</script>

</body>
</html>
